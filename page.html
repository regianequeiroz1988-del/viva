trato de distribuição. <strong>3 – VIGÊNCIA:<\/strong> A vigência do Título é de 2 meses. <strong>4 – RESGATE:<\/strong> O valor do resgate estará disponível ao Titular do direito de resgate após 2 meses de carência. <strong>5 – DATA, HORA E LOCAL DOS SORTEIOS:<\/strong> Os sorteios serão realizados pela ViaCap, na presença de Auditor Independente, na Av. Maringá, nº 1765, Bairro Vitória, Londrina\/PR - Sala Hora do Viva, no horário e dia indicados neste Título. O local da realização do sorteio é de livre acesso aos adquirentes do VIVA SORTE DO DIA V.02. <strong>6 – PRÊMIOS:<\/strong> O valor líquido da premiação será de 100.000 vezes o valor da contribuição. Para o recebimento do prêmio, quando contemplado, o Subscritor deverá apresentar o Título original contemplado ou o comprovante de aquisição pelo aplicativo\/site; RG e CPF válidos; comprovante de residência atualizado e os dados bancários para depósito. O valor dos prêmios descritos é líquido de imposto de renda. A VIACAP pagará, em moeda corrente nacional, a premiação em até 15 (quinze) dias corridos, contados da apresentação da documentação exigida, em conta de titularidade do subscritor. <strong>7 – DISPOSIÇÕES GERAIS:<\/strong> A aquisição implica automática adesão às Condições Gerais do Título, das quais o Subscritor declara ter tomado ciência previamente a aquisição. Os direitos e obrigações decorrentes deste Título prescrevem no prazo estabelecido na legislação. Na hipótese de extravio do Título, a responsabilidade será exclusivamente do Subscritor. O foro competente para dirimir eventuais questões oriundas do presente Regulamento será o do domicílio do Subscritor. É proibida a venda de título de capitalização a menores de dezesseis anos. A aprovação deste plano pela SUSEP, não implica, por parte da Autarquia, em incentivo ou recomendação à sua aquisição, representando, exclusivamente, sua adequação às normas em vigor. Os dados pessoais acessados em razão da contratação deste título de capitalização ser ntribuição única, podendo haver remuneração adicional, de acordo com a performance do produto, conforme previsto em contrato de distribuição. <strong>3 – VIGÊNCIA:</strong> A vigência do Título é de 2 meses. <strong>4 – RESGATE:</strong> O valor do resgate estará disponível ao Titular do direito de resgate após 2 meses de carência. <strong>5 – DATA, HORA E LOCAL DOS SORTEIOS:</strong> Os sorteios serão realizados pela ViaCap, na presença de Auditor Independente, na Av. Maringá, nº 1765, Bairro Vitória, Londrina/PR - Sala Hora do Viva, no horário e dia indicados neste Título. O local da realização do sorteio é de livre acesso aos adquirentes do VIVA SORTE DO DIA V.02. <strong>6 – PRÊMIOS:</strong> O valor líquido da premiação será de 100.000 vezes o valor da contribuição. Para o recebimento do prêmio, quando contemplado, o Subscritor deverá apresentar o Título original contemplado ou o comprovante de aquisição pelo aplicativo/site; RG e CPF válidos; comprovante de residência atualizado e os dados bancários para depósito. O valor dos prêmios descritos é líquido de imposto de renda. A VIACAP pagará, em moeda corrente nacional, a premiação em até 15 (quinze) dias corridos, contados da apresentação da documentação exigida, em conta de titularidade do subscritor. <strong>7 – DISPOSIÇÕES GERAIS:</strong> A aquisição implica automática adesão às Condições Gerais do Título, das quais o Subscritor declara ter tomado ciência previamente a aquisição. Os direitos e obrigações decorrentes deste Título prescrevem no prazo estabelecido na legislação. Na hipótese de extravio do Título, a responsabilidade será exclusivamente do Subscritor. O foro competente para dirimir eventuais questões oriundas do presente Regulamento será o do domicílio do Subscritor. É proibida a venda de título de capitalização a menores de dezesseis anos. A aprovação deste plano pela SUSEP, não implica, por parte da Autarquia, em incentivo ou recomendação à sua aquisição, representando, exclusivamente, sua ade este Título. O percentual de 49,17667% do valor da contribuição única do Título é destinado à capitalização, que irá gerar um capital mínimo de resgate igual a 49,33416%, ao fim da vigência. O valor de 1,66667% da contribuição única do Título é destinado ao sorteio. Os custos com promoção de distribuição do Título estão abrangidos pela quota de carregamento, que é de 49,15666%, e representam 1% da contribuição única, podendo haver remuneração adicional, de acordo com a performance do produto, conforme previsto em contrato de distribuição. <strong>3 – VIGÊNCIA:</strong> A vigência do Título é de 2 meses. <strong>4 – RESGATE:</strong> O valor do resgate estará disponível ao Titular do direito de resgate após 2 meses de carência. <strong>5 – DATA, HORA E LOCAL DOS SORTEIOS:</strong> Os sorteios serão realizados pela ViaCap, na presença de Auditor Independente, na Av. Maringá, nº 1765, Bairro Vitória, Londrina/PR - Sala Hora do Viva, no horário e dia indicados neste Título. O local da realização do sorteio é de livre acesso aos adquirentes do VIVA SORTE DO DIA V.02. <strong>6 – PRÊMIOS:</strong> O valor líquido da premiação será de 100.000 vezes o valor da contribuição. Para o recebimento do prêmio, quando contemplado, o Subscritor deverá apresentar o Título original contemplado ou o comprovante de aquisição pelo aplicativo/site; RG e CPF válidos; comprovante de residência atualizado e os dados bancários para depósito. O valor dos prêmios descritos é líquido de imposto de renda. A VIACAP pagará, em moeda corrente nacional, a premiação em até 15 (quinze) dias corridos, contados da apresentação da documentação exigida, em conta de titularidade do subscritor. <strong>7 – DISPOSIÇÕES GERAIS:</strong> A aquisição implica automática adesão às Condições Gerais do Título, das quais o Subscritor declara ter tomado ciência previamente a aquisição. Os direitos e obrigações decorrentes deste Título prescrevem no prazo estabelecido na legislação. Na hipótese de extravio do Título, a responsabilidade será exclusivamente do Subscritor. O foro competente para dirimir eventuais questões oriundas do presente Regulamento será o do domicílio do Subscritor. É proibida a venda de título de capitalização a menores de dezesseis anos. A aprovação deste plano pela SUSEP, não implica, por parte da Autarquia, em incentivo ou recomendação à sua aquisição, representando, exclusivamente, sua adequação às normas em vigor. Os dados pessoais acessados em razão da contratação deste título de capitalização serão tradados nos termos da Lei Geral de Proteção de Dados (Lei nº 13.709/2018). Para mais informações consulte o <strong>SAC: 0800 740 7819</strong>. OUVIDORIA: 0800 8741 505.</span></p>","hideRaffleCountdown":false,"blocks":[],"gambling":{"minimumBetPrice":"0.05","maximumBetPrice":"5","highestMultiplier":100000},"participationRules":{"canPurchaseBondsDirectly":true,"supportsFastSignUp":true},"cart":{"selectorAmounts":[50,100,150,200,300,500],"defaultAmountButtonIndex":1,"popularAmountButtonIndex":1},"instantGamesPoints":{},"benefitsClub":{"eligible":false,"pointsPerReal":null},"combos":[]}]},"status":200,"statusText":"OK","headers":{"cache-control":"max-age=60","content-type":"application\/json; charset=utf-8","etag":"1349591502"}},"GET \/system\/info\/features":{"data":{"payment":{"methods":false,"luckyNumbers":false,"quickCheckout":false},"security":{"proofOfWork":false,"rateLimiter":true,"authentication":false},"services":{"email":true,"messaging":true,"zendesk":false},"system":{"payment":true},"user":{"login":true,"signUp":true,"recoverPassword":false}},"status":200,"statusText":"OK","headers":{"cache-control":"max-age=60","content-type":"application\/json; charset=utf-8","etag":"2802388594"}},"GET \/raffle\/categories":{"data":[{"slug":"viva-sorte","label":"Viva Sorte +","description":"Pontos do Clube Viva Sorte +","iconUrl":"https://assets.vivasorteoficial.com.br/viva-sorte/categorias/1/2d32313131383538383836.png","displayOrder":1,"color":"#005bc9","isMai
